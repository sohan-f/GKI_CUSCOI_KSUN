name: Setup ZRAM
description: Configure ZRAM kernel configs, module entries, and patch files

inputs:
  kernel_version:
    description: "Kernel version string (e.g., 5.10, 6.6)"
    required: true
  android_version:
    description: "Android version string (e.g., android14, android15)"
    required: true

runs:
  using: "composite"
  steps:
      - name: Use ZRAM
        working-directory: ${{ github.workspace }}/kernel/common
        shell: bash
        run: |
          echo "Setup env"
          SUKISU_PATCHES=${{ github.workspace }}/sukisu_patches
          ZZH_PATCHES=${{ github.workspace }}/.github/actions/zram

          echo "Clonig SUKISU_PATCHES for zram"
          git clone https://github.com/ShirkNeko/SukiSU_patch.git $SUKISU_PATCHES

          echo "Upgrading LZ4..."
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $ZZH_PATCHES/zram/lz4/* ./lib/lz4/
          cp -r $ZZH_PATCHES/zram/include/linux/* ./include/linux/
          bash $ZZH_PATCHES/zram/apply_lz4_neon.sh

          if [ -f "fs/f2fs/Makefile" ] && ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
            echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
          fi

          cp -r $SUKISU_PATCHES/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/lib/* ./lib/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/crypto/* ./crypto/
          cp -r $SUKISU_PATCHES/other/zram/lz4k_oplus ./lib/

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4kd.patch ./
          if ! patch -p1 -F 3 < lz4kd.patch; then
            echo "::warning::Failed to apply lz4kd.patch; it may already be applied or the context may not match"
          fi

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4k_oplus.patch ./
          if ! patch -p1 -F 3 < lz4k_oplus.patch; then
            echo "::warning::Failed to apply lz4k_oplus.patch; it may already be applied or the context may not match"
          fi

      - name: Configure ZRAM core & crypto options
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_ZSMALLOC=y
            CONFIG_ZRAM=y
            CONFIG_CRYPTO_LZ4HC=y
            CONFIG_CRYPTO_LZ4K=y
            CONFIG_CRYPTO_LZ4KD=y
            CONFIG_CRYPTO_842=y
            CONFIG_CRYPTO_LZ4K_OPLUS=y

      - name: Configure ZRAM (5.10 specific options)
        if: inputs.kernel_version == '5.10'
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_MODULE_SIG=n
            CONFIG_CRYPTO_LZO=y
            CONFIG_ZRAM_DEF_COMP_LZ4KD=y

      - name: Clean up ZRAM build modules
        shell: bash
        run: |
          if [ "${{ inputs.android_version }}" = "android14" ] || [ "${{ inputs.android_version }}" = "android15" ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "${{ github.workspace }}/kernel/common/modules.bzl"
          fi
